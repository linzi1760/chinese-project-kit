name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-kit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.10'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check Python syntax
        run: python -m py_compile scripts/project_kit.py scripts/test_project_kit.py
      - name: Run project package tests
        working-directory: scripts
        env:
          PYTHONUTF8: '1'
        run: python -m unittest -v test_project_kit.py
